# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: an
      POSTGRES_PASSWORD: an
      POSTGRES_DB: automobilitynext
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U an"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
